name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências e copiar o app para o Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../OrcamentoFamiliar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrcamentoFamiliar-apk
          path: OrcamentoFamiliar.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Orçamento Familiar 1.${{ github.run_number }}
          body: Baixe o arquivo OrcamentoFamiliar.apk abaixo e instale no celular Android.
          files: OrcamentoFamiliar.apk
